name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bgeo_test
          POSTGRES_USER: bgeo_test
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bgeo_test -d bgeo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - run: go test -race ./... -timeout 120s
      - name: PostgreSQL concurrency and isolation contracts
        env:
          TEST_POSTGRES_DSN: postgres://bgeo_test:test_only_password@127.0.0.1:5432/bgeo_test?sslmode=disable
        run: go test -race ./internal/usecase ./internal/delivery/http -timeout 120s
      - run: go build ./cmd/server ./cmd/worker ./cmd/manage
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
