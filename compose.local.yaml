name: ${COMPOSE_PROJECT_NAME:-bgeo-local}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  APP_ENV: development
  APP_MODE: ${APP_MODE:-live}
  HTTP_ADDR: ":8080"
  DB_DRIVER: postgres
  DATABASE_URL: "postgres://bgeo:bgeodevpass@postgres:5432/bgeo?sslmode=disable"
  AUTO_MIGRATE: "true"
  SEED_DEMO: ${SEED_DEMO:-false}
  ALLOW_LOCAL_OUTBOUND: "true"
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-bgeo_local_jwt_access_secret_32bytes_dev!}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-bgeo_local_jwt_refresh_secret_32bytes_dev!}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-c29tZXJhbmRvbTMyeWJ5dGVzZW5jcnlwdGtleTEyMzQ=}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  REDIS_URL: "redis://redis:6379/0"
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  S3_BUCKET: "bgeo"
  PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
  COPILOT_API_KEY: ${COPILOT_API_KEY:-}
  COPILOT_BASE_URL: ${COPILOT_BASE_URL:-https://api.deepseek.com/v1}
  COPILOT_MODEL: ${COPILOT_MODEL:-deepseek-chat}

x-app: &app
  image: bgeo:local
  build:
    context: .
    target: production
  pull_policy: build
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *app-environment
  networks: [local_net]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  stop_grace_period: 30s
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bgeo
      POSTGRES_USER: bgeo
      POSTGRES_PASSWORD: bgeodevpass
    ports:
      - "${LOCAL_DB_PORT:-127.0.0.1:54320}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks: [local_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${LOCAL_REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_local_data:/data
    networks: [local_net]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${LOCAL_MINIO_PORT:-127.0.0.1:9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001"
    volumes:
      - minio_local_data:/data
    networks: [local_net]
    healthcheck:
      test: [CMD-SHELL, 'mc ready local >/dev/null 2>&1 || exit 0']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *logging

  api:
    <<: *app
    command: [server]
    restart: unless-stopped
    ports:
      - "${LOCAL_HTTP_PORT:-8080}:8080"
    volumes:
      - local_uploads:/app/data/uploads
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    environment:
      <<: *app-environment
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  bootstrap:
    <<: *app
    command: [manage, bootstrap]
    profiles: [tools]
    restart: "no"
    environment:
      <<: *app-environment
      AUTO_MIGRATE: "false"
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-admin@bgeo.local}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-admin12345678}
      BOOTSTRAP_BRAND: ${BOOTSTRAP_BRAND:-BgeoLocal}

networks:
  local_net:

volumes:
  postgres_local_data:
  redis_local_data:
  minio_local_data:
  local_uploads:
