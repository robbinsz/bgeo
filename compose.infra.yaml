name: ${COMPOSE_PROJECT_NAME:-bgeo-infra}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bgeo}
      POSTGRES_USER: ${POSTGRES_USER:-bgeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bgeodevpass}
    ports:
      - "${LOCAL_DB_PORT:-127.0.0.1:54320}:5432"
    volumes:
      - postgres_infra_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${LOCAL_REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_infra_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${LOCAL_MINIO_PORT:-127.0.0.1:9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001"
    volumes:
      - minio_infra_data:/data
    healthcheck:
      test: [CMD-SHELL, 'mc ready local >/dev/null 2>&1 || exit 0']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/bgeo --ignore-existing;
      exit 0;
      "
    restart: "no"

volumes:
  postgres_infra_data:
  redis_infra_data:
  minio_infra_data:
